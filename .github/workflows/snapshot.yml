name: snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-snapshot:
    name: Snapshot / ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux
          - os: macos-latest
            asset: macos
          - os: windows-latest
            asset: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f zig-out/bin/mychappie-coder.exe ]; then
            cp zig-out/bin/mychappie-coder.exe dist/mychappie-coder-${{ matrix.asset }}.exe
          else
            cp zig-out/bin/mychappie-coder dist/mychappie-coder-${{ matrix.asset }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mychappie-coder-${{ matrix.asset }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
